<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mening Kutubxonam</title>
  <link rel="stylesheet" href="main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body>
  <div class="container">
    <h1>Mening Kutubxonam 📚</h1>

    <form id="book-form">
      <input type="text" id="title" placeholder="Kitob nomi" required />
      <input type="text" id="author" placeholder="Muallif" required />
      <input type="number" id="pages" placeholder="Sahifalar soni" required />
      <div class="checkbox">
        <input type="checkbox" id="read" />
        <label for="read">O‘qib bo‘ldim</label>
      </div>
      <button type="submit">+ Kitob qo‘shish</button>
    </form>

    <div id="books-grid"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
